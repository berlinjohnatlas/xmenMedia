<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Men: A History in Key Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--bg:#fffdf5;--panel:#fff;--blue:#1b3a9c;--gold:#ffd400;--red:#e0202f;--muted:#444;--line:#bbb;
  --head:'Bangers','Impact',sans-serif;--body:'Comic Neue','Comic Sans MS',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.1rem;line-height:1.45;background:#0f1f5c radial-gradient(rgba(110,150,255,.22) 1.4px,transparent 1.7px) 0 0/12px 12px}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

header{padding:3.5rem 1.25rem 3rem;border-bottom:6px solid var(--ink);color:#fff;background:repeating-conic-gradient(from 0deg at 78% 55%,#2a50c8 0 7deg,#1b3a9c 7deg 14deg)}
.hero{max-width:62rem;margin:0 auto}
h1{margin:0;font-weight:400}
.logo{display:block;width:min(30rem,92%);height:auto;filter:drop-shadow(5px 5px 0 #111)}
.tag{display:inline-block;margin-top:.4rem;font-family:var(--head);font-size:clamp(2rem,6vw,3.6rem);letter-spacing:.04em;line-height:1;color:var(--gold);transform:rotate(-2deg);text-shadow:-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,2px 2px 0 #111,5px 5px 0 #111}
.sub{display:inline-block;max-width:34rem;margin:1.6rem 0 0;padding:.5rem .9rem;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:700}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:4px solid var(--ink);padding:.7rem 1.25rem}
.bar-in{max-width:62rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.chip,.key{font-family:var(--head);font-size:1.1rem;letter-spacing:.04em;border:3px solid var(--ink);background:#fff;color:var(--ink);padding:.15rem .8rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--gold)}
.key{border-color:var(--red);color:var(--red)}
.key.on{background:var(--red);color:#fff}
.spacer{flex:1}

main{max-width:62rem;margin:0 auto;padding:1.5rem 1.25rem 5rem}
.era{display:inline-block;font-family:var(--head);font-weight:400;font-size:2.4rem;letter-spacing:.05em;margin:2.5rem 0 .3rem;padding:.05rem 1rem;color:#fff;background:var(--red);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.5deg)}
.era-note{margin:.6rem 0 0;font-weight:700;color:#fff}
.totop{display:block;margin:2.5rem 0 0 auto;font-family:var(--head);font-size:1.2rem;letter-spacing:.05em;padding:.2rem 1.1rem;color:var(--ink);background:var(--gold);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.totop:hover{background:#fff}
ol{list-style:none;margin:2rem 0 0;padding:0;display:grid;gap:3rem}
li{position:relative}
.panel{position:relative;display:grid;grid-template-columns:12rem 1fr;gap:2.4rem;align-items:center;padding:1.4rem 1.6rem;background:var(--panel);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
li:nth-child(even) .panel{grid-template-columns:1fr 12rem}
li:nth-child(even) .cvr{order:2}
.yr{position:absolute;top:-1.6rem;left:-1.4rem;width:5.6rem;height:5.6rem;display:grid;place-items:center;font-family:var(--head);font-size:1.5rem;color:var(--red);background:var(--gold);transform:rotate(-8deg);
  clip-path:polygon(50% 0,61% 20%,82% 10%,80% 33%,100% 38%,85% 55%,98% 75%,75% 78%,70% 100%,50% 85%,30% 100%,25% 78%,2% 75%,15% 55%,0% 38%,20% 33%,18% 10%,39% 20%)}
li:nth-child(even) .yr{left:auto;right:-1.4rem;transform:rotate(8deg)}

.cvr{display:block;width:100%;padding:0;aspect-ratio:2/3;cursor:pointer;border:4px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg);overflow:hidden}
li:nth-child(even) .cvr{transform:rotate(2deg)}
.cvr:hover{transform:rotate(0) scale(1.03)}
.cvr img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:.5rem;text-align:center;background:var(--gold) radial-gradient(rgba(224,32,47,.45) 2px,transparent 2.4px) 0 0/10px 10px}
.ph b{font-family:var(--head);font-weight:400;font-size:3.2rem;line-height:1;color:var(--red);text-shadow:2px 2px 0 #111}
.ph i{font-style:normal;font-weight:700;font-size:.95rem}

.cap{display:inline-block;padding:.6rem .9rem;background:var(--gold);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.ttl{font-family:var(--head);font-weight:400;font-size:1.7rem;letter-spacing:.03em;line-height:1.1;margin:0}
.iss{margin:.1rem 0 .4rem;font-weight:700;font-size:.95rem}
.blurb{margin:0}
.bub{position:relative;margin:1.5rem 0 0;padding:.9rem 1.2rem;background:#fff;border:3px solid var(--ink);border-radius:2rem/1.6rem;font-weight:700}
.bub::before,.bub::after{content:"";position:absolute;width:0;height:0;border-style:solid}
.bub::before{left:-29px;top:1rem;border-width:12px 26px 12px 0;border-color:transparent var(--ink) transparent transparent}
.bub::after{left:-20px;top:calc(1rem + 3px);border-width:9px 21px 9px 0;border-color:transparent #fff transparent transparent}
li:nth-child(even) .bub::before{left:auto;right:-29px;border-width:12px 0 12px 26px;border-color:transparent transparent transparent var(--ink)}
li:nth-child(even) .bub::after{left:auto;right:-20px;border-width:9px 0 9px 21px;border-color:transparent transparent transparent #fff}

dialog{width:min(46rem,94vw);max-height:90vh;padding:0;border:4px solid var(--ink);background:var(--panel);color:var(--ink);box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(8,12,32,.75)}
.d-in{display:grid;grid-template-columns:minmax(0,14rem) 1fr;gap:1.25rem;padding:1.25rem}
.cover{aspect-ratio:2/3;background:var(--gold);border:3px solid var(--ink);display:grid;place-items:center;text-align:center;padding:.5rem;font-size:.9rem;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.d-ttl{font-family:var(--head);font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 .3rem}
.why{border-left:6px solid var(--red);padding-left:.8rem;margin:1rem 0;font-weight:700}
.cv{font-size:.95rem}
.cv p{margin:.4rem 0}
.close{position:absolute;top:.5rem;right:.5rem;font-family:var(--head);font-size:1.1rem;border:3px solid var(--ink);background:var(--gold);color:var(--ink);padding:.1rem .7rem;cursor:pointer}
.keyform{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.keyform input{flex:1;min-width:12rem;font:inherit;padding:.4rem;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.keyform button{font-family:var(--head);font-size:1.1rem;padding:.3rem 1rem;border:3px solid var(--ink);background:var(--gold);color:var(--ink);cursor:pointer}

@media (max-width:620px){
  .panel,li:nth-child(even) .panel{grid-template-columns:1fr;gap:1.2rem}
  li:nth-child(even) .cvr{order:0}
  .cvr{max-width:11rem;margin:0 auto}
  .bub::before,li:nth-child(even) .bub::before{left:2rem;right:auto;top:-29px;border-width:0 12px 26px 12px;border-color:transparent transparent var(--ink) transparent}
  .bub::after,li:nth-child(even) .bub::after{left:calc(2rem + 3px);right:auto;top:-20px;border-width:0 9px 21px 9px;border-color:transparent transparent #fff transparent}
  .d-in{grid-template-columns:1fr}.cover{max-width:12rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.cvr:hover{transform:none}}
</style>

  <p class="sub">Sixty years of mutants, told through the comics that changed the team. Select any issue for its story and cover.</p>

<<div class="bar"><div class="bar-in" id="bar" role="group" aria-label="Filter by era"></div></div>
<main id="timeline"></main>

<dialog id="dlg" aria-labelledby="d-ttl">
  <button class="close" id="close" aria-label="Close">Close</button>
  <div class="d-in">
    <div class="cover" id="cover">Loading cover…</div>
    <div>
      <h2 class="d-ttl" id="d-ttl"></h2>
      <p class="iss" id="d-iss"></p>
      <p id="d-sum"></p>
      <div class="why" id="d-why"></div>
      <div class="cv" id="d-cv"></div>
    </div>
  </div>
</dialog>

<script>
/* ---------- Curated data (works with no API key) ---------- */
const ERAS = {
  silver:{label:'Silver Age',note:'Teenagers, a wheelchair, and a school for gifted youngsters.'},
  new:{label:'The All-New, All-Different X-Men',note:'The relaunch that made the team an international franchise.'},
  claremont:{label:'Claremont at his peak',note:'Operatic storytelling and the stories fans still argue about.'},
  nineties:{label:'The 1990s',note:'Blockbuster sales, two teams, and the largest crossover epics.'},
  modern:{label:'2000s and beyond',note:'Reinvention, then a mutant nation.'}
};
const ISSUES = [
 {era:'silver',year:1963,title:'The X-Men debut',vol:'X-Men',num:'1',pub:'Sep 1963',
  sum:'Professor X recruits Cyclops, Beast, Angel, Iceman and Marvel Girl and introduces Magneto in the same issue.',
  why:'It sets up the central conflict: peaceful coexistence against mutant supremacy.'},
 {era:'silver',year:1965,title:'The Sentinels arrive',vol:'X-Men',num:'14',pub:'Nov 1965',
  sum:'Bolivar Trask unveils giant robots built to hunt mutants.',
  why:'The Sentinels become the franchise\'s defining symbol of prejudice turned into policy.'},
 {era:'new',year:1975,title:'A new team takes flight',vol:'Giant-Size X-Men',num:'1',pub:'Summer 1975',
  sum:'Professor X gathers Wolverine, Storm, Nightcrawler, Colossus and Thunderbird to rescue the original team from Krakoa.',
  why:'It rebooted the series with an international cast and began the book\'s long run as a bestseller.'},
 {era:'new',year:1976,title:'Wolverine and the Phoenix take center stage',vol:'Uncanny X-Men',num:'101',pub:'Oct 1976',
  sum:'Jean Grey becomes Phoenix after piloting the shuttle through deadly radiation.',
  why:'It starts the Phoenix saga, the franchise\'s most famous long-form story.'},
 {era:'claremont',year:1980,title:'The Dark Phoenix Saga ends',vol:'Uncanny X-Men',num:'137',pub:'Sep 1980',
  sum:'Jean Grey, consumed by the Phoenix power, makes a final choice on the moon.',
  why:'Marvel\'s editors demanded the ending, a rare moment of a major hero\'s death with lasting consequences.'},
 {era:'claremont',year:1981,title:'Days of Future Past',vol:'Uncanny X-Men',num:'141',pub:'Jan 1981',
  sum:'Kate Pryde\'s mind is sent back from a Sentinel-ruled future to stop an assassination.',
  why:'The time-travel template that later films and series borrowed repeatedly.'},
 {era:'claremont',year:1982,title:'God Loves, Man Kills',vol:'X-Men: God Loves, Man Kills',num:'1',pub:'Dec 1982',
  sum:'Reverend Stryker\'s crusade pushes the X-Men and Magneto into an uneasy alliance.',
  why:'Marvel\'s first graphic novel for the team and a direct treatment of bigotry and religion.'},
 {era:'claremont',year:1983,title:'Wolverine meets the world alone',vol:'Wolverine',num:'1',pub:'Sep 1982',
  sum:'Wolverine travels to Japan to confront Lord Shingen over Mariko Yashida.',
  why:'Showed a mutant character could carry his own book and launched Wolverine as a solo star.'},
 {era:'nineties',year:1991,title:'Jim Lee relaunches the franchise',vol:'X-Men',num:'1',pub:'Oct 1991',
  sum:'Blue and Gold teams face Magneto in a new series written by Chris Claremont with art by Jim Lee.',
  why:'It sold over eight million copies, among the best-selling comic books ever printed.'},
 {era:'nineties',year:1994,title:'Age of Apocalypse begins',vol:'X-Men: Alpha',num:'1',pub:'Feb 1995',
  sum:'Legion\'s time-travel accident reshapes reality, and Apocalypse rules North America.',
  why:'The first modern alternate-reality event that replaced the entire line for four months.'},
 {era:'nineties',year:1996,title:'Onslaught',vol:'X-Men',num:'53',pub:'Aug 1996',
  sum:'Professor X\'s darkest impulses merge with Magneto\'s psyche and lash out.',
  why:'It led to the Heroes Reborn event and removed several Marvel icons from the main continuity for a year.'},
 {era:'modern',year:2001,title:'New X-Men reinvents the team',vol:'New X-Men',num:'114',pub:'Jul 2001',
  sum:'Grant Morrison and Frank Quitely reimagine the school as a bold, strange educational institution.',
  why:'It opens the book to a new generation of readers and strongly influenced the later films.'},
 {era:'modern',year:2005,title:'House of M',vol:'House of M',num:'1',pub:'Aug 2005',
  sum:'The Scarlet Witch rewrites reality, and the Avengers and X-Men try to stop her.',
  why:'Its three words, "No more mutants", cut mutantkind to a few hundred.'},
 {era:'modern',year:2019,title:'House of X',vol:'House of X',num:'1',pub:'Oct 2019',
  sum:'Jonathan Hickman and Pepe Larraz relaunch the franchise around the island nation of Krakoa.',
  why:'It rebuilds the X-Men as a sovereign mutant nation with a new political structure.'}
];

/* ---------- Render timeline ---------- */
const $ = id => document.getElementById(id);
let filter = 'all';

function renderBar(){
  const bar = $('bar'); bar.innerHTML = '';
  const mk = (k,l) => {
    const b = document.createElement('button');
    b.className='chip'; b.textContent=l; b.setAttribute('aria-pressed', filter===k);
    b.onclick = () => { filter=k; renderBar(); renderTimeline(); };
    bar.appendChild(b);
  };
  mk('all','All eras');
  Object.entries(ERAS).forEach(([k,e]) => mk(k,e.label));
}

function renderTimeline(){
  const main = $('timeline'); main.innerHTML = '';
  Object.entries(ERAS).forEach(([k,e]) => {
    if (filter!=='all' && filter!==k) return;
    const h = document.createElement('h2'); h.className='era'; h.textContent=e.label;
    const n = document.createElement('p'); n.className='era-note'; n.textContent=e.note;
    const ol = document.createElement('ol');
    ISSUES.filter(i => i.era===k).forEach(i => {
      const li = document.createElement('li');
      li.innerHTML = `<article class="panel"><span class="yr"></span><button class="cvr"><span class="ph"><b></b><i></i></span></button><div class="txt"><div class="cap"><h3 class="ttl"></h3><p class="iss"></p><p class="blurb"></p></div><p class="bub"></p></div></article>`;
      li.querySelector('.yr').textContent = i.year;
      li.querySelector('.ph b').textContent = '#' + i.num;
      li.querySelector('.ph i').textContent = i.vol;
      li.querySelector('.cvr').setAttribute('aria-label', `Open ${i.vol} #${i.num}`);
      li.querySelector('.ttl').textContent = i.title;
      li.querySelector('.iss').textContent = `${i.vol} #${i.num}, ${i.pub}`;
      li.querySelector('.blurb').textContent = i.sum;
      li.querySelector('.bub').textContent = i.why;
      li.querySelector('.cvr').onclick = () => openIssue(i);
      ol.appendChild(li);
      queueCover(i, li.querySelector('.cvr'));
    });
    const top = document.createElement('button');
    top.className = 'totop'; top.textContent = 'Back to top';
    top.onclick = () => window.scrollTo({top:0});
    main.append(h,n,ol,top);
  });
}

/* Covers load one at a time so we stay friendly to ComicVine's rate limits */
let coverQueue = Promise.resolve();
function queueCover(i, btn){
  coverQueue = coverQueue.then(async () => {
    try{
      const r = await fetchIssue(i);
      if (r.image && r.image.medium_url && btn.isConnected){
        const img = new Image(); img.alt = `Cover of ${i.vol} #${i.num}`; img.src = r.image.medium_url;
        btn.replaceChildren(img);
      }
    }catch(e){ /* keep the placeholder cover */ }
  });
}

/* ---------- ComicVine (JSONP: the API sends no CORS headers) ---------- */
const cache = {};

async function cvGet(path, params){
  const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
  const url = `https://comicvine.gamespot.com/api/${path}?${qs}`;
  let data;
  try{
    const resp = await fetch(url.replace('https://comicvine.gamespot.com','/cv') + '&format=json');
    data = await resp.json();
  }catch(e){ throw new Error('server not reachable'); }
  if (data.status_code !== 1) throw new Error(data.error || 'API error');
  return data.results;
}
const norm = s => (s||'').toLowerCase().replace(/^the /,'').replace(/[^a-z0-9]+/g,' ').trim();
const FIELDS = 'name,issue_number,volume,image,cover_date,description,site_detail_url';

async function fetchIssue(i){
  const id = i.vol + '#' + i.num;
  if (cache[id]) return cache[id];
  const yr = i.pub.slice(-4), want = norm(i.vol);
  let hit;
  if (i.cv){ // optional manual override: put a ComicVine issue id in the data as cv:123456
    hit = await cvGet(`issue/4000-${i.cv}/`, {field_list:FIELDS});
  } else {
    const rs = await cvGet('search/', {resources:'issue', limit:50, query:`${i.vol} ${i.num}`, field_list:FIELDS});
    const ok = rs.filter(r => String(r.issue_number)===String(i.num) && r.volume && (r.cover_date||'').startsWith(yr));
    hit = ok.find(r => norm(r.volume.name)===want) || ok.find(r => norm(r.volume.name).includes(want));
  }
  if (!hit) throw new Error(`No match for ${i.vol} #${i.num} (${yr})`);
  return cache[id] = hit;
}

const strip = html => { const d = document.createElement('div'); d.innerHTML = html||''; return d.textContent.trim(); };

async function openIssue(i){
  $('d-ttl').textContent = i.title;
  $('d-iss').textContent = `${i.vol} #${i.num}, ${i.pub}`;
  $('d-sum').textContent = i.sum;
  $('d-why').textContent = i.why;
  $('d-cv').textContent = '';
  const cover = $('cover'); cover.textContent = 'No cover loaded';
  $('dlg').showModal();

  cover.textContent = 'Loading cover…';
  try{
    const r = await fetchIssue(i);
    cover.innerHTML = '';
    if (r.image && r.image.medium_url){
      const img = new Image(); img.alt = `Cover of ${i.vol} #${i.num}`; img.src = r.image.medium_url; cover.appendChild(img);
    } else cover.textContent = 'No cover image on ComicVine';
    const desc = strip(r.description).slice(0,500);
    const cv = $('d-cv'); cv.innerHTML = '';
    const m = document.createElement('p'); m.textContent = `ComicVine match: ${r.volume.name} #${r.issue_number}, ${r.cover_date}`; cv.appendChild(m);
    if (desc){ const p = document.createElement('p'); p.textContent = desc + (desc.length>=500?'…':''); cv.appendChild(p); }
    if (r.site_detail_url){ const a = document.createElement('a'); a.href = r.site_detail_url; a.target='_blank'; a.rel='noopener'; a.textContent = 'View on ComicVine'; cv.appendChild(a); }
  }catch(e){
    cover.textContent = 'Cover unavailable';
    $('d-cv').textContent = `ComicVine lookup failed (${e.message}). Make sure server.py is running and has your key in it.`;
  }
}

$('close').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
renderBar(); renderTimeline();
</script>
